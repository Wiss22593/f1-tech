name: FIA auto-publish

on:
  workflow_dispatch:
  schedule:
    # Generic UTC cadence, including night-time FP1. Starts are best-effort.
    - cron: '17,47 * * * *'

permissions:
  contents: write

concurrency:
  group: fia-auto-publish-main
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Resolve the current official calendar and FP1 watch window
        id: window
        run: node --use-system-ca ingestion/fia/auto-publish.mjs window

      - name: Exit successfully outside an ingestion window
        if: steps.window.outputs.relevant != 'true'
        run: echo "No verified FP1 watch window is active. Nothing to publish."

      - name: Discover presentation document and check whether its bytes changed
        id: discovery
        if: steps.window.outputs.relevant == 'true'
        run: node --use-system-ca ingestion/fia/scheduled.mjs --resolution=ingestion/output/calendar/watch-event.json --preflight=true

      - name: Install reproducible dependencies
        if: steps.discovery.outputs.needs_pipeline == 'true'
        run: npm ci

      - name: Restore pinned translation model cache
        if: steps.discovery.outputs.needs_pipeline == 'true'
        uses: actions/cache@v4
        with:
          path: ingestion/output/translation-models
          key: fia-es-model-${{ runner.os }}-${{ hashFiles('src/data/fia-localization/automatic-policy.json') }}

      - name: Install pinned translation runtime
        if: steps.discovery.outputs.needs_pipeline == 'true'
        env:
          ONNXRUNTIME_NODE_INSTALL_CUDA: skip
        run: npm ci --prefix ingestion/fia/translation-runtime

      - name: Validate ingestion modules
        if: steps.discovery.outputs.needs_pipeline == 'true'
        run: |
          node --check ingestion/fia/auto-publish.mjs
          node --check ingestion/fia/request.mjs
          node --check ingestion/fia/official-calendar.mjs
          node --check ingestion/fia/scheduled.mjs
          node --check ingestion/fia/finder.mjs
          node --check ingestion/fia/downloader.mjs
          node --check ingestion/fia/extractor.mjs
          node --check ingestion/fia/parser.mjs
          node --check ingestion/fia/normalizer.mjs
          node --check ingestion/fia/validator.mjs
          node --check ingestion/fia/publication.mjs
          node --check ingestion/fia/translate-es.mjs
          node --check ingestion/fia/translation-runtime/engine.mjs
          node --check src/services/fia/translation-policy.mjs
          node --check ingestion/fia/run.mjs
          node --check ingestion/fia/backfill.mjs

      - name: Discover and atomically publish deterministic records
        if: steps.discovery.outputs.needs_pipeline == 'true'
        run: node --use-system-ca ingestion/fia/scheduled.mjs --resolution=ingestion/output/calendar/watch-event.json --publish=true

      - name: Run the complete test suite
        if: steps.discovery.outputs.needs_pipeline == 'true'
        run: npm test

      - name: Enforce final validation and the data-only allowlist
        if: steps.discovery.outputs.needs_pipeline == 'true'
        id: guard
        env:
          AUTO_PUBLISH_EXPECTED_EVENT_ID: ${{ steps.window.outputs.event_id }}
        run: node ingestion/fia/auto-publish.mjs validate

      - name: Commit the single validated event dataset
        if: steps.guard.outputs.has_changes == 'true'
        env:
          DATASET_PATH: ${{ steps.window.outputs.dataset_path }}
          COMMIT_MESSAGE: ${{ steps.guard.outputs.commit_message }}
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- "$DATASET_PATH"
          staged=$(git diff --cached --name-only)
          if [ "$staged" != "$DATASET_PATH" ]; then
            echo "::error title=UNAUTHORIZED_STAGED_PATH::Only the validated event dataset may be committed."
            exit 1
          fi
          git commit -m "$COMMIT_MESSAGE"

      - name: Push validated data to main
        if: steps.guard.outputs.has_changes == 'true'
        id: push
        shell: bash
        run: |
          if ! output=$(git push origin HEAD:main 2>&1); then
            echo "$output"
            echo "::error title=BRANCH_PROTECTION_BLOCKED::The validated data commit could not be pushed to main. No protection rule was bypassed."
            exit 1
          fi
          echo "$output"

      - name: Preserve validated output if the push is blocked
        if: failure() && steps.guard.outputs.has_changes == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: fia-auto-publish-blocked-${{ github.run_id }}
          path: |
            ${{ steps.window.outputs.dataset_path }}
            ingestion/output/reports/
          if-no-files-found: error

      - name: Preserve ingestion diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fia-ingestion-diagnostics-${{ github.run_id }}
          path: |
            ingestion/output/calendar/
            ingestion/output/reports/
            ingestion/output/manual-review/
            ingestion/output/draft/
          if-no-files-found: ignore
